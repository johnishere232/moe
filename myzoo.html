<html>
<head>
    <title>my zoo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: aliceblue;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #ff5a43
        }
        #zoo {
            border: 2px solid #ff5a43;
            width: 300px;
            margin: 16px auto;
            padding:12px;
            border-radius: 10px;
            background: white;

            .zone {
                border: 1px solid #ff5a43;
                margin: 6px;
                padding: 8px 12px;
                border-radius: 6px;
                text-align: left;
            }
            
            button {
                background: #ff5a43;
                color: white;
                padding: 10px 24px;
                border: none;
                border-radius: 20px;
                cursor: pointer;
            }


        }
    </style>
</head>
<body>
    <h1> my zoo</h1>
    <p>use java script and the dom to add animals to each cage</p>
    <div id="zoo">
        <div class="zone">zone one <span id="zone1"></span></div>
        <div class="zone">zone two <span id="zone2"></span></div>
        <div class="zone">zone three <span id="zone3"></span></div>
        <div class="zone">total animals <span id="total"></span>
        </div>
    </div>
    <br>
    <button onclick="openZoo()">open the zoo</button>
    <p id="zoo-status"></p>
    <script>
    function openZoo() {
      document.getElementById("zone1").innerHTML = "Lion";

      document.getElementById("zone2").innerHTML ="Elephant";

      document.getElementById("zone3").innerHTML = "Penguin";

      document.getElementById("total").innerHTML = "3";

      document.getElementById("zoo").style.backgroundColor ="lightgreen"

      document.getElementById("zoo-status").innerHTML = document.title + "is now open!";
    }
    </script>
</body>

</html>
